name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: KamenRic1er
          outputs: |
            dist/github-snake-cyber.svg?color_snake=#E63946&color_dots=#101218,#2E2F38,#5F6270,#A9ACB8,#F2F2EE
            dist/github-snake-cyber-light.svg?color_snake=#C8102E&color_dots=#F2EFE6,#D8D3C4,#A8A394,#5C5850,#1A1A1F
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
